<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 翰林國中藝術表演沙龍 - 智慧滿版繪本</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ─── 💡 背景改為富有透光感的科技微光漸層 ─── */
        body { 
            display: flex; 
            flex-direction: column; 
            font-family: "Noto Serif TC", "Songti TC", serif; 
            background: linear-gradient(135deg, #a2b095 0%, #abb89e 50%, #c4cfb9 100%);
            margin: 0; 
            height: 100vh; 
            overflow: hidden; 
            color: #2b332c; 
            padding: 20px; 
            box-sizing: border-box; 
        }

        /* ─── 💡 頂部標題欄：扁平化毛玻璃果凍 ─── */
        #main-header { 
            background: rgba(253, 250, 242, 0.65); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px 40px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: none; 
            margin-bottom: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            flex-shrink: 0; 
        }
        #main-header .sub-title { font-size: 14px; color: #4e5a3c; letter-spacing: 3px; margin-bottom: 5px; font-weight: bold; }
        #main-header .main-title { font-size: 20px; color: #2d382e; font-weight: 700; margin: 0; letter-spacing: 1px; text-shadow: 0 1px 1px rgba(255,255,255,0.5); }
        #main-content { flex: 1; display: flex; width: 100%; overflow: hidden; position: relative; }
        
        /* ─── 💡 側邊欄：扁平化毛玻璃果凍 ─── */
        #sidebar { 
            width: 280px; 
            background: rgba(253, 250, 242, 0.55); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 25px 20px; 
            box-sizing: border-box; 
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: none; 
            border-radius: 28px; 
            z-index: 100; 
            margin-right: 20px; 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0; 
        }
        #sidebar h3 { color: #4e5a3c; border-bottom: 2px solid rgba(90, 104, 68, 0.1); padding-bottom: 15px; margin-top: 0; font-size: 16px; text-align: center; margin-bottom: 10px; }
        #book-list { overflow-y: auto; flex: 1; margin-top: 10px; }
        
        /* ─── 💡 書本選擇按鈕：果凍質感 ─── */
        .book-btn { 
            display: block; 
            width: 100%; 
            padding: 12px 15px; 
            margin: 10px 0; 
            background: linear-gradient(135deg, #64754d 0%, #5a6844 100%); 
            color: #fdfaf2; 
            border: 1px solid rgba(255,255,255,0.15); 
            border-radius: 20px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 13px; 
            font-weight: bold; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: 0 2px 8px rgba(90, 104, 68, 0.08), inset 0 1px 1px rgba(255,255,255,0.2); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .book-btn:hover { 
            background: linear-gradient(135deg, #728557 0%, #64754d 100%); 
            transform: translateY(-1px); 
            box-shadow: 0 4px 15px rgba(90, 104, 68, 0.15), inset 0 1px 1px rgba(255,255,255,0.3);
        }
        .book-btn.active { 
            background: linear-gradient(135deg, #323d33 0%, #3d4a3e 100%); 
            border-color: rgba(255,255,255,0.05);
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.2), 0 1px 1px rgba(255,255,255,0.05); 
        }
        
        /* ─── 💡 主舞台容器：扁平化高科技底盤 ─── */
        #stage-container { 
            flex: 1; 
            background: rgba(253, 250, 242, 0.4); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: none;
            border-radius: 32px; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center; 
            padding: 16px; 
            padding-bottom: 80px; 
            perspective: 2500px; 
            overflow: hidden; 
            position: relative; 
            box-sizing: border-box;
        }
        
        /* 書本主框架：完全扁平化 */
        .book-outer { 
            width: calc(100% - 32px); 
            height: calc(100% - 16px); 
            position: relative; 
            transform-style: flat; 
            transform: none; 
            transition: transform 0.5s; 
            flex-shrink: 0; 
        }
        
        /* 內頁優化：紙張扁平科技感 */
        .page { 
            width: 50%; 
            height: 100%; 
            padding: 50px 40px; 
            box-sizing: border-box; 
            background: rgba(247, 240, 225, 0.94); 
            position: absolute; 
            top: 0; 
            border: 1px solid rgba(235, 220, 197, 0.8); 
            backface-visibility: hidden; 
            -webkit-backface-visibility: hidden; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            transform: translateZ(0); 
        }
        
        /* 文字頁中界線實體化（淺綠色實線） */
        .page-left { 
            left: 0; 
            border-radius: 24px 0 0 24px; 
            border-right: 1.5px solid #abb89e; /* 🚀 修改：文字頁右側實線 */
            transform-origin: right center; 
            z-index: 2; 
        }
        .page-right { 
            left: 50%; 
            border-radius: 0 24px 24px 0; 
            border-left: 1.5px solid #abb89e; /* 🚀 修改：文字頁左側實線 */
            transform-origin: left center; 
            z-index: 1; 
        }

        /* 中界線容器（用來控制實線的顯示/隱藏） */
        .page-left .line-left, .page-right .line-right {
            position: absolute;
            top: 0;
            width: 1.5px;
            height: 100%;
            background: #abb89e; /* 🚀 修改：淺綠色中界線顏色 */
            z-index: 3;
        }
        .page-left .line-left { right: -1.5px; } /* 🚀 核心修改：精準定位 */
        .page-right .line-right { left: -1.5px; } /* 🚀 核心修改：精準定位 */

        /* 封面底部懸浮文字框 */
        .cover-full-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; 
            justify-content: flex-end; align-items: center; 
            padding-bottom: 100px; 
        }
        .cover-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .cover-text-box { 
            position: relative; 
            width: 82%; 
            background: rgba(253, 250, 242, 0.75); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 18px 15px; 
            border-radius: 20px; 
            box-shadow: none; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.5); 
            box-sizing: border-box; 
        }
        .cover-title { font-size: 22px; font-weight: 700; color: #2d382e; margin-bottom: 8px; display: block; line-height: 1.3; }
        .cover-author { font-size: 14px; color: #5a6844; font-weight: 500; border-top: 1px solid rgba(235,220,197,0.6); padding-top: 8px; display: inline-block; }

        /* 滿版跨頁插圖容器（隨父層自動伸縮） */
        .page-full-spread { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 5; transform: translateZ(0); pointer-events: none; }
        .spread-part { 
            width: 50%; height: 100%; position: absolute; top: 0; overflow: hidden; background: #f7f0e1; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: translateZ(0); 
            /* 🚀 修改：跨頁圖不需要中界線與邊框 */
            border: none !important;
        }
        .spread-part.full-spread-image { transform-style: flat; transform: none; }
        
        /* 🚀 修正跨頁插圖邊緣：完全移除中界線 */
        .spread-left-part { left: 0; border-radius: 24px 0 0 24px; border-right: none !important; }
        .spread-right-part { left: 50%; border-radius: 0 24px 24px 0; border-left: none !important; }
        
        .full-img-part { width: 200%; height: 100%; position: absolute; top: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 24px; }
        .full-img-part img { width: 100%; height: 100%; object-fit: cover; }
        .full-img-part-left { left: 0; }
        .full-img-part-right { left: -100%; }

        /* 內容字體 */
        .scene-title { color: #5a6844; font-weight: bold; font-size: 18px; border-bottom: 2px solid #ebdcc5; padding-bottom: 10px; margin-bottom: 20px; line-height: 1.2; }
        .text-body { font-size: 16px; line-height: 1.9; text-align: justify; flex: 1; white-space: normal; word-break: break-all; color: #2b332c; }
        
        #ruler-container { position: absolute; visibility: hidden; height: auto; width: 400px; padding: 0; font-size: 16px; line-height: 1.9; font-family: "Noto Serif TC", "Songti TC", serif; word-break: break-all; }

        /* 控制區 */
        .controls { 
            position: absolute; 
            bottom: 24px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            z-index: 200; 
            flex-shrink: 0; 
            background: rgba(253, 250, 242, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: none;
        }
        .nav-btn { 
            background: linear-gradient(135deg, #ffffff 0%, #f4f0e6 100%); 
            color: #5a6844; 
            border: 1px solid rgba(90, 104, 68, 0.25); 
            padding: 8px 22px; 
            border-radius: 18px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
            white-space: nowrap; 
            box-shadow: none;
        }
        .nav-btn:hover:not(:disabled) { 
            background: linear-gradient(135deg, #5a6844 0%, #4e5a3c 100%); 
            color: #fdfaf2; 
            border-color: transparent;
            transform: translateY(-1px);
            box-shadow: none;
        }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
        .page-indicator { color: #4e5a3c; font-size: 14px; font-weight: bold; margin: 0 8px; min-width: 70px; text-align: center; }
        #loading-msg { color: #5a6844; font-weight: bold; text-align: center; padding: 10px; font-size: 13px; }

        /* 📱 RWD 手機版樣式 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            #main-header { padding: 10px 15px; margin-bottom: 10px; border-radius: 16px; box-shadow: none; }
            #main-header .sub-title { font-size: 11px; letter-spacing: 1px; }
            #main-header .main-title { font-size: 14px; }
            #main-content { flex-direction: column; }

            #sidebar {
                width: 100%; margin-right: 0; margin-bottom: 10px; padding: 8px 12px; border-radius: 18px; flex-direction: row; align-items: center; gap: 10px; box-sizing: border-box;
                background: rgba(253, 250, 242, 0.5); border: 1px solid rgba(255,255,255,0.4); box-shadow: none;
            }
            #sidebar h3 { border-bottom: none; padding-bottom: 0; margin-bottom: 0; font-size: 12px; white-space: nowrap; color: #4e5a3c; }
            #book-list { display: flex; flex-direction: row; gap: 8px; margin-top: 0; overflow-x: auto; overflow-y: hidden; width: 100%; scrollbar-width: none; }
            #book-list::-webkit-scrollbar { display: none; }

            .book-btn { display: inline-block; width: auto; flex-shrink: 0; max-width: 140px; margin: 0; padding: 8px 12px; font-size: 11px; border-radius: 14px; box-shadow: none;}
            
            #stage-container { padding: 16px; padding-bottom: 75px; border-radius: 24px; background: rgba(253, 250, 242, 0.35); box-shadow: none;}

            .book-outer { width: calc(100% - 32px); height: calc(100% - 16px); transform: none; box-shadow: none; }
            
            /* 手機直式滾動內頁 */
            .page-mobile-scroll {
                width: 100%; height: 100%; padding: 30px 24px; box-sizing: border-box; background: rgba(247, 240, 225, 0.96); position: absolute; top: 0; left: 0; border: 1px solid rgba(235, 220, 197, 0.7); border-radius: 24px; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; box-shadow: none;
            }
            
            .page-left { width: 100%; border-radius: 24px; border-right: none !important; }
            .page-right { width: 100%; left: 0; border-radius: 24px; border-left: none !important; }
            
            /* 手機版中界線歸零 */
            .page-left .line-left, .page-right .line-right { display: none !important; }

            .page-full-spread { width: 100%; }
            .spread-part { width: 100%; left: 0; border-radius: 24px; border: none !important; background: #f7f0e1; }
            .spread-part.full-spread-image { transform-style: flat; transform: none; border: none !important; }
            .full-img-part { width: 100%; border-radius: 24px; }
            .full-img-part-right { left: 0; }
            
            .full-img-part img { width: 100%; height: 100%; object-fit: contain; padding: 10px; box-sizing: border-box; }
            
            #ruler-container { width: 400px; }
            
            .controls { bottom: 20px; gap: 4px; padding: 4px 8px; box-shadow: none; }
            .nav-btn { padding: 6px 14px; font-size: 12px; border-radius: 14px; box-shadow: none; }
            .page-indicator { font-size: 12px; min-width: 55px; margin: 0; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="sub-title">2026 翰林國中藝術表演沙龍</div>
        <h1 class="main-title">劇本的N種讀法-結合SEL與角色扮演課程實踐工作坊展示</h1>
    </header>

    <main id="main-content">
        <nav id="sidebar">
            <h3>學員劇本區</h3>
            <div id="loading-msg">同步中...</div>
            <div id="book-list"></div>
        </nav>

        <section id="stage-container">
            <div class="book-outer" id="book-viewport"></div>

            <div class="controls">
                <button class="nav-btn home-btn" onclick="resetToCover()">🏠 封面</button>
                <button class="nav-btn" id="prev-btn" onclick="goPrev()">⬅ 上一頁</button>
                <span class="page-indicator" id="page-num">0 / 0</span>
                <button class="nav-btn" id="next-btn" onclick="goNext()">下一頁 ➡</button>
            </div>
        </section>
    </main>

    <div id="ruler-container"></div>

    <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS_sVLsu1HvFx4istfpCvkJ5jGQtd6NyxybbEb7L_1onPLlTCW-ntb-BOVhdDYJBjlyDsHO0ghmnXKn/pub?output=csv';

    let rawData = [];
    let currentTeacherIndex = -1;
    let currentSpreadIndex = 0;
    let teacherSpreads = [];

    // 動態物理高度測量
    function paginateByHeight(text, title) {
        if (!text || text.toString().trim() === '') return [];

        const ruler = document.getElementById('ruler-container');
        const samplePage = document.querySelector('.page') || document.querySelector('.page-mobile-scroll');
        if (samplePage) {
            const computedStyle = window.getComputedStyle(samplePage);
            const paddingX = parseFloat(computedStyle.paddingLeft) + parseFloat(computedStyle.paddingRight);
            ruler.style.width = (samplePage.offsetWidth - paddingX) + 'px';
        } else {
            ruler.style.width = (window.innerWidth <= 768 ? '350px' : '420px');
        }

        let paragraphs = text.toString().split(/\r?\n/);
        let pages = [];
        let currentPageParagraphs = [];
        
        const viewportHeight = document.getElementById('stage-container').offsetHeight;
        const maxHeight = viewportHeight > 0 ? (viewportHeight * 0.55) : 360; 

        for (let i = 0; i < paragraphs.length; i++) {
            let p = paragraphs[i].trim();
            if (p === '') { currentPageParagraphs.push('<br>'); continue; }

            let testList = [...currentPageParagraphs, p];
            ruler.innerHTML = testList.join('<br>');
            
            if (ruler.offsetHeight > maxHeight && currentPageParagraphs.length > 0) {
                pages.push(currentPageParagraphs.join('<br>'));
                currentPageParagraphs = [p];
            } else {
                currentPageParagraphs.push(p);
            }
        }
        
        if (currentPageParagraphs.length > 0) pages.push(currentPageParagraphs.join('<br>'));

        return pages.map((pageText, index) => {
            let displayTitle = title;
            if (pages.length > 1) displayTitle += ` (${index + 1}/${pages.length})`;
            return `<div class="scene-title">${displayTitle}</div><div class="text-body">${pageText}</div>`;
        });
    }

    // 智慧標題產生器
    function getActTitle(index, totalActs) {
        const chineseNumbers = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        const fixedTitles = ['起', '承', '轉', '合'];
        const numStr = chineseNumbers[index] || (index + 1);
        
        if (index < 4) {
            return `【第${numStr}幕：${fixedTitles[index]}】`;
        } else {
            return `【第${numStr}幕】`;
        }
    }

    function buildBookPages(data) {
        const spreads = [];
        
        // 1. 封面
        spreads.push({
            type: 'cover-v3',
            imgUrl: data.imgCover,
            title: data.title,
            author: data.name
        });

        // 2. 智慧動態遍歷所有幕數
        const acts = data.acts || [];
        acts.forEach((act, idx) => {
            const textPages = paginateByHeight(act.text, act.title);
            if (textPages.length === 0 && (!act.img || act.img.trim() === '')) return;

            for (let i = 0; i < textPages.length; i += 2) {
                let leftContent = textPages[i];
                let rightContent = textPages[i+1] ? textPages[i+1] : ''; 
                
                spreads.push({
                    type: 'standard',
                    left: { type: 'text', content: leftContent },
                    right: { type: 'text', content: rightContent }
                });
            }

            if (act.img && act.img.trim() !== '') {
                spreads.push({
                    type: 'full-spread-image',
                    imgUrl: act.img,
                    isFinalAct: idx === acts.length - 1
                });
            }
        });

        return spreads;
    }

    // 💡 智慧圖片頁處理引擎：如果是大圖頁，就把中界線藏起來
    function renderPage() {
        const viewport = document.getElementById('book-viewport');
        viewport.innerHTML = '';
        
        if (teacherSpreads.length === 0) return;
        const spread = teacherSpreads[currentSpreadIndex];
        const isMobile = window.innerWidth <= 768;
        
        if (spread.type === 'cover-v3') {
            if (!isMobile) {
                const leftPage = document.createElement('div');
                leftPage.className = `page page-left line-left`;
                leftPage.style.opacity = '0';
                leftPage.innerHTML = `<div class="line-left"></div>`; // 封面左頁藏起來，但中界線容器還在
                viewport.appendChild(leftPage);
            }
            
            const rightPage = document.createElement('div');
            rightPage.className = `page ${isMobile ? 'page-left' : 'page-right line-right'}`;
            rightPage.style.padding = '0';
            // 封面圖片不需要中界線線條，因此這裡不加 line-left/line-right 容器
            rightPage.innerHTML = `
                <div class="cover-full-container">
                    <img class="cover-bg-img" src="${spread.imgUrl}" onerror="this.src='https://picsum.photos/500/600';">
                    <div class="cover-text-box">
                        <span class="cover-title">《${spread.title || '未命名劇本'}》</span>
                        <span class="cover-author">編劇：${spread.author || '未知'} 老師</span>
                    </div>
                </div>`;
            viewport.appendChild(rightPage);
            
        } else if (spread.type === 'standard') {
            if (isMobile) {
                const combinedPage = document.createElement('div');
                combinedPage.className = 'page-mobile-scroll';
                
                let htmlBuffer = spread.left ? spread.left.content : '';
                if (spread.right && spread.right.content.trim() !== '') {
                    htmlBuffer += `<hr style="border:0; border-top:1px dashed #ebdcc5; margin: 20px 0;">` + spread.right.content;
                }
                
                combinedPage.innerHTML = htmlBuffer;
                // 手機版為單頁，隱藏原本的 line-left/line-right
                viewport.appendChild(combinedPage);
            } else {
                const leftPage = document.createElement('div');
                leftPage.className = `page page-left line-left`;
                leftPage.innerHTML = (spread.left ? spread.left.content : '') + `<div class="line-left"></div>`; // 🚀 文字左頁：補上中界線線條
                if(!spread.left) leftPage.style.opacity = '0';
                
                const rightPage = document.createElement('div');
                rightPage.className = `page page-right line-right`;
                rightPage.innerHTML = (spread.right.content !== '' ? spread.right.content : '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#888;font-style:italic;text-align:center;padding:40px;">精彩劇本內容請翻閱下頁</div>') + `<div class="line-right"></div>`; // 🚀 文字右頁：補上中界線線條

                viewport.appendChild(leftPage);
                viewport.appendChild(rightPage);
            }
            
        } else if (spread.type === 'full-spread-image') {
            // 🚀 💡 插圖頁：徹底扁平化，不需要中界線
            const fullSpread = document.createElement('div');
            fullSpread.className = 'page-full-spread';
            
            const leftPart = document.createElement('div');
            leftPart.className = 'spread-part spread-left-part full-spread-image';
            leftPart.innerHTML = `
                <div class="full-img-part full-img-part-left">
                    <img src="${spread.imgUrl}" onerror="this.parentElement.innerHTML='插圖載入失敗，請檢查網址'">
                </div>`;
                
            const rightPart = document.createElement('div');
            rightPart.className = `spread-part ${isMobile ? "spread-left-part" : "spread-right-part"} full-spread-image`;
            rightPart.innerHTML = `
                <div class="full-img-part ${isMobile ? "full-img-part-left" : "full-img-part-right"}">
                    <img src="${spread.imgUrl}" onerror="this.parentElement.innerHTML='插圖載入失敗，請檢查網址'">
                    ${spread.isFinalAct ? '<div style="position:absolute;bottom:25px;right:25px;background:rgba(247,240,225,0.95);padding:10px 20px;border-radius:12px;font-size:14px;font-weight:bold;color:#3d4a3e;z-index:200;box-shadow:none;">【全劇終】</div>' : ''}
                </div>`;
            
            if (isMobile) {
                fullSpread.appendChild(rightPart);
            } else {
                fullSpread.appendChild(leftPart);
                fullSpread.appendChild(rightPart);
            }
            viewport.appendChild(fullSpread);
        }

        document.getElementById('page-num').innerText = `${currentSpreadIndex + 1} / ${teacherSpreads.length}`;
        document.getElementById('prev-btn').disabled = currentSpreadIndex === 0;
        document.getElementById('next-btn').disabled = currentSpreadIndex === teacherSpreads.length - 1;
    }

    function selectTeacher(index) {
        if (index < 0 || index >= rawData.length) return;
        currentTeacherIndex = index;
        currentSpreadIndex = 0;
        teacherSpreads = buildBookPages(rawData[index]);
        document.querySelectorAll('.book-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
        renderPage();
        
        const activeBtn = document.querySelectorAll('.book-btn')[index];
        if(activeBtn && window.innerWidth <= 768) {
            activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
    }

    function goNext() { if(currentSpreadIndex < teacherSpreads.length - 1) { currentSpreadIndex++; renderPage(); } }
    function goPrev() { if(currentSpreadIndex > 0) { currentSpreadIndex--; renderPage(); } }
    function resetToCover() { currentSpreadIndex = 0; renderPage(); }

    function parseCSV(text) {
        let lines = [];
        let row = [""];
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let next = text[i+1];
            if (c === '"') {
                if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                else { inQuotes = !inQuotes; }
            } else if (c === ',' && !inQuotes) {
                row.push('');
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && next === '\n') { i++; }
                lines.push(row);
                row = [''];
            } else {
                row[row.length - 1] += c;
            }
        }
        if (row.length > 1 || row[0] !== '') lines.push(row);
        return lines;
    }

    async function loadCloudData() {
        try {
            const response = await fetch(SHEET_URL);
            const text = await response.text();
            const rows = parseCSV(text);
            
            let tempRawData = [];
            rows.forEach((cells, index) => {
                if(index > 0 && cells && cells[0] && cells[0].trim() !== '' && cells[0] !== "老師姓名") {
                    
                    let actsData = [];
                    let actIndex = 0;
                    
                    for (let start = 3; start < cells.length; start += 2) {
                        let textVal = cells[start] ? cells[start].trim() : '';
                        let imgVal = cells[start + 1] ? cells[start + 1].trim() : '';
                        
                        if (textVal !== '' || imgVal !== '') {
                            actsData.push({
                                title: getActTitle(actIndex, 0),
                                text: textVal,
                                img: imgVal
                            });
                            actIndex++;
                        }
                    }

                    tempRawData.push({
                        name: cells[0].trim(), 
                        title: cells[1] ? cells[1].trim() : '未命名劇本', 
                        imgCover: cells[2] ? cells[2].trim() : '',
                        acts: actsData 
                    });
                }
            });

            if(tempRawData.length > 0) {
                rawData = tempRawData;
                const list = document.getElementById('book-list');
                list.innerHTML = '';
                
                rawData.forEach((data, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'book-btn';
                    btn.innerText = `📖 ${data.name} 老師 - ${data.title}`;
                    btn.onclick = () => selectTeacher(i);
                    list.appendChild(btn);
                });

                if(currentTeacherIndex === -1) {
                    selectTeacher(0);
                } else {
                    teacherSpreads = buildBookPages(rawData[currentTeacherIndex]);
                    renderPage();
                }
                document.getElementById('loading-msg').style.display = 'none';
            }
        } catch (e) {
            console.error(e);
            document.getElementById('loading-msg').innerText = '同步失敗';
        }
    }

    window.onresize = () => { 
        if(currentTeacherIndex !== -1 && rawData[currentTeacherIndex]) {
            teacherSpreads = buildBookPages(rawData[currentTeacherIndex]);
        }
        renderPage(); 
    };

    window.onload = () => {
        loadCloudData();
        setInterval(loadCloudData, 20000); 
    };
    </script>
</body>
</html>
